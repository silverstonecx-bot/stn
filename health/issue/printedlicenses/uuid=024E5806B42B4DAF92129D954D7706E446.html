<style>
  /* Fixed Main Navigation Header */
  #baladyTopHeaderMount {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    z-index: 99999 !important;
    background-color: #ffffff !important;
    transition: all 0.3s ease;
  }

  /* Fixed body offset padding */
  body {
    padding-top: 200px !important;
  }

  /* --- ACTIVATED ONLY ON SCROLL --- */

  /* Apply shadow on scroll */
  body.is-scrolled #baladyTopHeaderMount {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
  }

  /* Hide top/utility bars on scroll */
  body.is-scrolled #baladyTopHeaderMount .top-bar,
  body.is-scrolled #baladyTopHeaderMount .header-top,
  body.is-scrolled #baladyTopHeaderMount .top-header,
  body.is-scrolled #baladyTopHeaderMount .utility-bar,
  body.is-scrolled #baladyTopHeaderMount [class*="topbar"],
  body.is-scrolled #baladyTopHeaderMount [class*="top-bar"] {
    display: none !important;
  }

  /* Alignment adjustments on scroll */
  body.is-scrolled #baladyTopHeaderMount nav,
  body.is-scrolled #baladyTopHeaderMount .navbar {
    display: flex !important;
    align-items: center !important;
    margin: 0 !important;
  }
</style>

<script>
  (function() {
    function handleScroll() {
      if (window.scrollY > 0) {
        document.body.classList.add('is-scrolled');
      } else {
        document.body.classList.remove('is-scrolled');
      }
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll(); // Trigger immediately on initial load
