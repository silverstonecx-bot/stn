  body {

  body.is-scrolled #baladyTopHeaderMount {

  body.is-scrolled #baladyTopHeaderMount [class*="topbar"],
  body.is-scrolled #baladyTopHeaderMount [class*="top-bar"] {

<script>
  (function() {
    function handleScroll() {
      if (window.scrollY > 0) {
        document.body.classList.add('is-scrolled');

      }
    }

    window.addEventListener('scroll', handleScroll, { passive: true });
    handleScroll(); // Trigger immediately on initial load
